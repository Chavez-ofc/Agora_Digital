name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Aplication/**"
      - ".github/workflows/build_apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true

      - name: Install Flet CLI
        run: python -m pip install --upgrade pip flet

      - name: Build APK
        working-directory: Aplication
        run: flet build apk --module-name app --product "Ágora Digital"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agora-digital-apk
          path: Aplication/build/apk/*.apk
          if-no-files-found: warn
          retention-days: 7
