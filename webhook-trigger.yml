name: Automação via Webhook

on:
  repository_dispatch:
    # 'types' define o nome do evento customizado que você irá disparar
    types: [atualizar_banco]

jobs:
  executar-script:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar script de atualização
        env:
          # Lê o payload enviado no webhook (se houver)
          CLIENTE_ID: ${{ github.event.client_payload.cliente_id }}
        run: |
          python script_atualizar.py
